<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civic Alert Lite</title>

    <!-- Link to external stylesheets -->
    <link rel="stylesheet" href="style.css" />

    <!-- Manifest file for PWA -->
    <link rel="manifest" href="manifest.json" />

    <!-- Favicon link -->
    <link
      rel="icon"
      href="images/icon-192.png"
      sizes="192x192"
      type="image/png"
    />

    <!-- Meta tags for PWA -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="background-color" content="#ffffff" />

    <!-- Firebase JS SDKs -->
    <script
      type="module"
      src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"
    ></script>
    <script
      type="module"
      src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"
    ></script>

    <!-- Link to Firebase config and app script -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Civic Alert Lite</h1>

      <!-- Alert form -->
      <form id="alertForm" class="alert-form">
        <label for="alertMessage">Alert Message:</label>
        <input type="text" id="alertMessage" required />

        <label for="cityOrTown">City or Town:</label>
        <input type="text" id="cityOrTown" required />

        <label for="actionDept">Action Department (optional):</label>
        <input
          type="text"
          id="actionDept"
          placeholder="e.g., fire, police, etc."
        />

        <label for="intensity">Intensity (optional):</label>
        <select id="intensity">
          <option value="" disabled selected>Select intensity</option>
          <option value="FYI">FYI</option>
          <option value="Caution">Caution</option>
          <option value="Urgent">Urgent</option>
          <option value="Emergency">Emergency</option>
        </select>

        <label for="resources">Resources to Avail (optional):</label>
        <input
          type="text"
          id="resources"
          placeholder="e.g., first aid kit, car, etc."
        />

        <button type="submit" class="btn">Report Alert</button>
      </form>

      <!-- Display alert list -->
      <ul id="alertList"></ul>
      <button id="loadMoreBtn" class="more-btn">More Alerts</button>
    </div>

    <!-- Register service worker -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("service-worker.js")
          .then((reg) => console.log("Service Worker Registered!", reg))
          .catch((err) =>
            console.error("Service Worker registration failed: ", err)
          );
      }
    </script>
  </body>
</html>
